# Advanced PPO Training Configuration for Path Planning
# This configuration is designed for better convergence and performance

# Environment parameters
state_dim: 27              # Extended state representation for advanced environment (x, y, heatmap, actions, etc., dynamic obstacles info)
action_dim: 5              # 5 actions for advanced environment (up, right, down, left, wait)
hidden_dim: 128            # Hidden layer size
network_layers: 3          # Number of hidden layers

# PPO hyperparameters - Tuned for better performance in complex environments
learning_rate: 0.0003      # Learning rate optimized for complex environments
gamma: 0.999               # High gamma to consider long-term rewards
lam: 0.95                  # GAE lambda for balanced advantage estimation
epsilon: 0.2               # PPO clip parameter
epochs: 10                 # Number of update epochs
batch_size: 128            # Batch size for stable updates

# Training parameters
episodes: 20000            # Increased episodes for complex environment training
max_steps: 600             # More steps to navigate around obstacles

# Regularization and exploration
entropy_coef: 0.03         # Increased entropy to encourage exploration in complex environments
dropout_rate: 0.1          # Dropout for regularization
use_curriculum_learning: true  # Use curriculum learning to gradually increase difficulty

# Advanced training techniques
use_gradient_clipping: true     # Enable gradient clipping
gradient_clip_value: 0.5        # Gradient clipping value
use_lr_scheduler: true          # Learning rate scheduling
lr_decay_rate: 0.999            # Slower learning rate decay

# Reward shaping for complex environments
collision_penalty: -2.0         # Increased penalty for hitting obstacles
goal_reward: 25.0               # Higher reward for reaching goal
time_penalty: -0.03             # Reduced time penalty to allow longer paths

# Logging
log_interval: 200          # Log every N episodes

# Environment settings for advanced environment (course learning)
env_width: 30              # Environment width
env_height: 30             # Environment height
obstacle_ratio: 0.10       # Initial obstacle ratio for easier learning
obstacle_ratio_final: 0.25 # Final obstacle ratio for full complexity
dynamic_obstacles: 1       # Initial dynamic obstacles
dynamic_obstacles_final: 4 # Final dynamic obstacles
terrain_variations: false   # Disable terrain variations initially